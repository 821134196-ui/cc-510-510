<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>养老机构呼叫与夜巡系统</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="wrap" style="max-width:760px">
  <h1 style="color:var(--deep-green);margin:26px 0 6px">养老机构呼叫与夜巡系统</h1>
  <p class="muted">床位 · 呼叫按钮 · 当班护理员 · 夜巡计划一体化（演示数据均为虚构样本）</p>
  <div class="cards" style="margin-top:30px">
    <a class="card" href="/screen" style="text-decoration:none;color:inherit">
      <div class="where">楼层屏</div>
      <div class="muted">高对比大字 · 楼层床位图 · 呼叫位置与时间紧邻 · 报警必配文字</div>
    </a>
    <a class="card" href="/phone" style="text-decoration:none;color:inherit">
      <div class="where">护理员手机端</div>
      <div class="muted">仅当前待办：到床确认、处理结果、误触说明、急救结案</div>
    </a>
    <a class="card" href="/leader" style="text-decoration:none;color:inherit">
      <div class="where">值班长台</div>
      <div class="muted">实时呼叫派单 · 误触核对 · 夜巡 · 交班记录 · 响应统计 · 住户资料</div>
    </a>
  </div>
  <div class="card" style="margin-top:24px">
    <div class="where">演示账号（虚构）</div>
    <div class="muted">值班长：<b>L1</b> / 口令 1234（另有 L2）　护理员：<b>N1–N4</b> / 口令 0000</div>
  </div>
</div>
</body>
</html>
